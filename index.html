<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temario de Informática</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Sora:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d0d12;--surf1:#13131a;--surf2:#1a1a24;--surf3:#22222f;--surf4:#2a2a3a;
  --bd:#2e2e42;--bd2:#3a3a50;
  --txt:#e8e8f2;--txt2:#b0b0cc;--txt3:#7878a0;
  --a0:#8b7ff7;--a1:#56d4b2;--a2:#f47c6e;--a3:#6ab8f5;--a4:#e07be0;--a5:#f5cc45;--a6:#82dd95;--a7:#f5a348;
  --code-bg:#0a0a10;--code-bd:#252535;
  --sb:260px;
  --content-max:900px;
  --gap:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.75;display:flex;min-height:100vh;overflow-x:hidden}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surf4);border-radius:3px}

#sb{
  width:var(--sb);min-width:var(--sb);
  background:var(--surf1);
  border-right:1px solid var(--bd);
  position:fixed;top:0;left:0;
  height:100vh;overflow-y:auto;
  z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#sb-head{
  padding:20px 18px 14px;
  border-bottom:1px solid var(--bd)
}
#sb-head h1{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:700;
  color:var(--a0);
  letter-spacing:.1em;
  text-transform:uppercase
}
#sb-head p{
  font-size:11px;
  color:var(--txt3);
  margin-top:3px
}
#sb-search{
  padding:10px 14px;
  border-bottom:1px solid var(--bd)
}
#sb-search input{
  width:100%;background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:6px;
  padding:6px 10px;
  color:var(--txt2);
  font-size:12px;
  font-family:'Sora',sans-serif;
  outline:none
}
#sb-search input::placeholder{
  color:var(--txt3)
}
#sb-search input:focus{
  border-color:var(--a0)
}
.sb-bloque{
  border-bottom:1px solid var(--bd);
  padding:6px 0
}
.sb-bloque-hdr{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
  border-radius:4px;
  margin:2px 6px
}
.sb-bloque-hdr:hover{
  background:var(--surf2)
}
.sb-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  flex-shrink:0
}
.sb-bloque-title{
  flex:1;
  font-size:11.5px;
  font-weight:500;
  color:var(--txt)
}
.sb-bloque-num{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--txt3);
  background:var(--surf3);
  padding:2px 6px;
  border-radius:3px
}
.sb-chevron{
  font-size:10px;
  color:var(--txt3);
  transition:transform .2s;
  flex-shrink:0
}
.sb-bloque.closed .sb-chevron{
  transform:rotate(-90deg)
}
.sb-bloque.closed .sb-items{
  display:none
}
.sb-sec-label{
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--txt3);
  padding:7px 18px 3px;
  margin-top:4px
}
.sb-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 18px 4px 24px;
  font-size:11.5px;
  color:var(--txt3);
  cursor:pointer;
  transition:color .15s;
  border-left:2px solid transparent;
  margin:1px 0;
  text-decoration:none
}
.sb-item:hover{
  color:var(--txt2)
}
.sb-item.active{
  color:var(--txt);
  border-left-color:var(--a0);
  background:rgba(139,127,247,.05)
}
.sb-item::before{
  content:'›';
  font-size:12px;
  opacity:.5;
  flex-shrink:0
}

#hamburger{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:300;
  background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  flex-direction:column;
  gap:4px;
  align-items:center;
  justify-content:center
}
#hamburger span{
  display:block;
  width:18px;
  height:2px;
  background:var(--txt2);
  border-radius:2px;
  transition:all .25s
}
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:150;
  backdrop-filter:blur(2px)
}

#main{
  margin-left:var(--sb);
  flex:1;
  min-width:0;
  padding:48px 60px 100px;
}
.main-inner{
  max-width:var(--content-max);
  margin:0 auto
}

.toc-wrap{
  background:var(--surf1);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:22px 26px;
  margin-bottom:48px
}
.toc-wrap h2{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--txt3);
  margin-bottom:14px
}
.toc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px
}
.toc-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:8px;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  text-decoration:none
}
.toc-item:hover{
  border-color:var(--bd2);
  background:var(--surf3)
}
.toc-num{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  min-width:20px
}
.toc-lbl{
  font-size:12px;
  color:var(--txt2)
}

.bloque{
  margin-bottom:80px;
  scroll-margin-top:20px
}
.bloque-hdr{
  display:flex;
  align-items:flex-start;
  gap:16px;margin-bottom:30px;
  padding-bottom:20px;
  border-bottom:1px solid var(--bd)
}
.bloque-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:4px;
  border:1px solid;
  flex-shrink:0;
  margin-top:6px;
  white-space:nowrap
}
.bloque-hdr h2{
  font-size:clamp(20px,3vw,28px);
  font-weight:600;
  line-height:1.2
}
.bloque-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px
}
.b-tag{
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid var(--bd);
  color:var(--txt3)
}

.section{
  margin-bottom:32px
}
.sec-title{
  font-size:13px;
  font-weight:600;
  color:var(--txt2);
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px
}
.sec-title::before{
  content:'';
  display:block;
  width:3px;
  height:14px;
  border-radius:2px;
  background:var(--bd2)
}

.topic{
  background:var(--surf1);
  border:1px solid var(--bd);
  border-radius:10px;
  margin-bottom:8px;
  overflow:hidden;
  scroll-margin-top:20px
}
.topic-hdr{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  cursor:pointer;
  user-select:none;
  transition:background .15s
}
.topic-hdr:hover{
  background:var(--surf2)
}
.t-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0
}
.t-title{
  flex:1;
  font-size:13.5px;
  font-weight:500;
  color:var(--txt)
}
.t-tag{
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  padding:2px 8px;
  border-radius:3px;
  flex-shrink:0
}
.t-chev{
  font-size:12px;
  color:var(--txt3);
  transition:transform .2s;
  flex-shrink:0
}
.topic.open .t-chev{
  transform:rotate(90deg)
}
.topic-body{
  display:none;
  padding:4px 16px 18px;
  border-top:1px solid var(--bd)
}
.topic.open .topic-body{
  display:block
}

.tabs{
  display:flex;
  gap:0;
  margin:14px 0 0;
  border-bottom:1px solid var(--bd)
}
.tab-btn{
  background:none;
  border:none;
  padding:7px 14px;
  font-size:12px;
  font-family:'Sora',sans-serif;
  color:var(--txt3);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s,border-color .15s
}
.tab-btn:hover{
  color:var(--txt2)
}
.tab-btn.active{
  color:var(--txt);
  border-bottom-color:var(--a0)
}
.tab-pane{
  display:none;
  padding-top:12px
}
.tab-pane.active{
  display:block
}

.items-list{
  list-style:none;
  columns:2;
  column-gap:20px
}
.items-list li{
  font-size:12.5px;
  color:var(--txt2);
  padding:3px 0 3px 14px;
  position:relative;
  break-inside:avoid;
  line-height:1.6
}
.items-list li::before{
  content:'›';
  position:absolute;
  left:0;
  color:var(--txt3)
}
.items-list li strong{
  color:var(--txt);
  font-weight:500
}

.prac-list{
  list-style:none
}
.prac-item{
  display:flex;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--bd)
}
.prac-item:last-child{
  border-bottom:none
}
.prac-num{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--a1);
  font-weight:700;
  flex-shrink:0;
  margin-top:2px;
  min-width:20px
}
.prac-text{
  font-size:12.5px;
  color:var(--txt2);
  line-height:1.6
}
.prac-text strong{
  color:var(--txt)
}

.code-wrap{
  margin:4px 0
}
.code-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--txt3);
  padding:8px 14px 6px;
  background:var(--code-bg);
  border:1px solid var(--code-bd);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.copy-btn{
  background:var(--surf3);
  border:1px solid var(--bd);
  border-radius:4px;
  padding:3px 8px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  color:var(--txt3);
  cursor:pointer;
  transition:color .15s
}
.copy-btn:hover{
  color:var(--txt)
}
pre{
  background:var(--code-bg);
  border:1px solid var(--code-bd);
  border-radius:0 0 8px 8px;
  padding:14px;
  overflow-x:auto;
  line-height:1.6;
  margin:0
}
pre code{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:#c8c8e0;
  background:none;
  padding:0;
  white-space:pre
}

.items-list code, .prac-text code{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background:var(--surf3);
  padding:1px 5px;
  border-radius:3px;
  color:var(--a1)
}

.note{
  margin-top:12px;
  background:rgba(245,204,69,.05);
  border-left:3px solid var(--a5);
  border-radius:0 6px 6px 0;
  padding:10px 14px;
  font-size:12px;
  color:#c8c060;
  line-height:1.6
}
.note strong{
  color:var(--a5)
}

.c0{
  color:var(--a0)
} .c1{
  color:var(--a5)
} .c2{
  color:var(--a3)
} .c3{
  color:var(--a1)
}
.c4{
  color:var(--a2)
} .c5{
  color:var(--a4)
} .c6{
  color:var(--a2)
} .c7{
  color:var(--a6)
}
.c8{

} .c9{
  color:var(--a0)
} .c10{

} .c11{

}
.c12{
  color:var(--a4)
} .c13{
  color:var(--a7)
} .c14{
  color:var(--a2)
}

.bg0{
  background:rgba(139,127,247,.1);
  color:var(--a0);
  border-color:var(--a0)
}
.bg1{
  background:rgba(245,204,69,.1);
  color:var(--a5);
  border-color:var(--a5)
}

  background:rgba(106,184,245,.1);
  color:var(--a3);
  border-color:var(--a3)
}

  background:rgba(86,212,178,.1);
  color:var(--a1);
  border-color:var(--a1)
}

  background:rgba(244,124,110,.1);
  color:var(--a2);
  border-color:var(--a2)
}

  color:var(--a4);

  color:var(--a2);

}

}

  color:var(--a0);

}

}

  background:rgba(86,212,178,.1);
  color:var(--a1);

}

}

}

.dot0{
  background:var(--a0)
} .dot1{
  background:var(--a5)
} .dot2{
  background:var(--a3)
}

@media(max-width:1439px){
  :root{
    --sb:240px;
    --content-max:820px
  }
  #main{
    padding:40px 44px 80px
  }
}

@media(max-width:1023px){
  :root{
    --sb:220px
  }
  #main{
    padding:32px 32px 80px
  }
  .items-list{
    columns:1
  }
}

@media(max-width:767px){
  #hamburger{
    display:flex
  }
  #sb{
    transform:translateX(-100%)
  }
  #sb.open{
    transform:translateX(0)
  }
  #overlay{
    display:none
  }
  #overlay.visible{
    display:block
  }
  #main{
    margin-left:0;
    padding:20px 16px 80px
  }
  .bloque-hdr{
    flex-direction:column;
    gap:8px
  }
  .items-list{
    columns:1
  }
  .toc-grid{
    grid-template-columns:1fr 1fr
  }
  .tabs{
    overflow-x:auto
  }
}

@media(min-width:2000px){
  :root{
    --sb:300px;
    --content-max:1100px
  }
  body{
    font-size:15px
  }
  #main{
    padding:64px 80px 120px
  }
  pre code{
    font-size:13px
  }
}

</head>
<body>

<button id="hamburger" aria-label="Menú" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<div id="overlay" onclick="toggleSidebar()"></div>

<nav id="sb">
  <div id="sb-head">
    <h1>Temario · Informática</h1>
    <p>Desde cero hasta hacking ético</p>
  </div>
  <div id="sb-search"><input type="text" id="sb-input" placeholder="Buscar tema..." oninput="filterSidebar(this.value)"></div>
  <div id="sb-nav"></div>
</nav>

<main id="main">
  <div class="main-inner">
    <div class="toc-wrap">
      <h2>Índice de bloques</h2>
      <div class="toc-grid" id="toc"></div>
    </div>
    <div id="content"></div>
  </div>
</main>

<script>

function safe(str) {
  const escaped = str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  return escaped.replace(/&lt;(\/?(code|strong|em|b|i|br|kbd))&gt;/g, '<$1>');
}

const BLOQUES = [
{
  id:'b0', label:'BLOQUE 0', title:'Mentalidad y metodología',

    { title:'Cómo aprender tecnología', topics:[
      { title:'El método correcto de aprendizaje técnico', tag:'Filosofía',
        items:[
          'El síndrome del tutorial infinito: ver horas de vídeo sin construir nada <strong>no funciona</strong>',
          'Ciclo correcto: concepto → ejemplo → práctica → mini-proyecto → enseñar',
          'Aprendizaje basado en proyectos: construir algo real desde el primer día',
          'El error como herramienta: si no fallas, no estás en el límite de tu conocimiento',
          'Tiempo de calidad vs cantidad: 1 hora concentrada supera 4 horas dispersas',
          'Efecto Dunning-Kruger en tecnología: la "meseta de desesperación" es normal',
          'Cuándo pedir ayuda: luchar 20 minutos antes de preguntar, explicar qué intentaste',
          'Usar IA correctamente: como tutor socrático, no como copiadora de soluciones',
          'Rubber duck debugging: explicar el problema en voz alta a un objeto — funciona de verdad',
          'El repositorio de aprendizaje: un repo en GitHub con todos los ejercicios organizados'
        ],
        practica:[
          'Configurar Obsidian o Notion como diario técnico diario',
          'Crear repo en GitHub: <code>aprendizaje-informatica</code> con carpetas por bloque',
          'Tablero Kanban (Trello/Notion): columnas "por aprender / estudiando / dominado"',
          'Instalar Anki y crear el primer mazo con 10 conceptos básicos'
        ],
        code:[{ lang:'bash', label:'Estructura recomendada del repo de aprendizaje', src:
`# Crear la estructura del repositorio de aprendizaje
mkdir -p aprendizaje-informatica/{bloque-00-metodologia,bloque-01-fundamentos,bloque-02-ofimatica,bloque-03-redes,bloque-04-windows,bloque-05-linux,bloque-06-programacion,bloque-07-c,bloque-08-poo,bloque-09-java,bloque-10-javascript,bloque-11-rust,bloque-12-web,bloque-13-devops,bloque-14-hacking}

# Dentro de cada bloque
mkdir -p bloque-07-c/{teoria,ejercicios,proyectos,notas}

# README inicial
cat > README.md << 'EOF'
# Aprendizaje de Informática
Repositorio personal de estudio. Actualizado a diario.

## Progreso

...
EOF

git init && git add . && git commit -m "feat: estructura inicial del repositorio"` }]
      },
      { title:'Inglés técnico — no es opcional', tag:'Transversal',
        items:[
          'El 90% de la documentación técnica está en inglés y no va a cambiar',
          'Vocabulario base esencial: <strong>repository, deploy, debug, compile, runtime, instance</strong>',
          'Más vocab: <strong>endpoint, payload, callback, scope, heap, pointer, buffer, socket, thread</strong>',
          'Leer errores en inglés: extraer la información útil de un <em>stack trace</em>',
          'Stack Overflow: cómo hacer una buena pregunta (código mínimo reproducible, contexto, lo que intentaste)',

`import threading
import time

lock_a = threading.Lock()
lock_b = threading.Lock()

def hilo_1():
    with lock_a:
        print("Hilo 1: tiene lock_a, espera lock_b...")
        time.sleep(0.1)
        with lock_b:  # ← Este lock ya lo tiene Hilo 2
            print("Hilo 1: tiene ambos locks")  # nunca llega aquí

def hilo_2():
    with lock_b:
        print("Hilo 2: tiene lock_b, espera lock_a...")
        time.sleep(0.1)
        with lock_a:  # ← Este lock ya lo tiene Hilo 1
            print("Hilo 2: tiene ambos locks")  # nunca llega aquí

t1 = threading.Thread(target=hilo_1)
t2 = threading.Thread(target=hilo_2)
t1.start()
t2.start()
# El programa se cuelga aquí. Usa Ctrl+C para terminar.
# Solución: adquirir siempre los locks en el mismo orden`

`import time
import random

def busqueda_lineal(arr, objetivo):
    for i, v in enumerate(arr):
        if v == objetivo:
            return i
    return -1

def busqueda_binaria(arr, objetivo):
    izq, der = 0, len(arr) - 1
    while izq <= der:
        mid = (izq + der) // 2
        if arr[mid] == objetivo:
            return mid
        elif arr[mid] < objetivo:
            izq = mid + 1
        else:
            der = mid - 1
    return -1

# Comparar con distintos tamaños
for n in [100, 1_000, 10_000, 100_000]:
    arr = sorted(random.sample(range(n * 10), n))
    objetivo = arr[-1]  # Peor caso: último elemento

    t0 = time.perf_counter()
    busqueda_lineal(arr, objetivo)
    t_lineal = (time.perf_counter() - t0) * 1e6  # microsegundos

    t0 = time.perf_counter()
    busqueda_binaria(arr, objetivo)
    t_binaria = (time.perf_counter() - t0) * 1e6

    print(f"n={n:>7}: lineal={t_lineal:>8.2f}µs  binaria={t_binaria:>6.2f}µs")`

// ── Demostración de punteros ──────────────────────────────
void demo_punteros(void) {
    int x = 42;
    int *ptr = &x;        // ptr apunta a x

    printf("Valor de x:      %d\n", x);
    printf("Dirección de x:  %p\n", (void*)&x);
    printf("Valor de ptr:    %p\n", (void*)ptr);   // igual que &x
    printf("Valor en *ptr:   %d\n", *ptr);          // igual que x

    *ptr = 100;           // modifica x a través del puntero
    printf("x después de *ptr=100: %d\n", x);

    // Aritmética de punteros
    int arr[5] = {10, 20, 30, 40, 50};
    int *p = arr;         // apunta al primer elemento
    for (int i = 0; i < 5; i++)
        printf("arr[%d] = %d  (en %p)\n", i, *(p + i), (void*)(p + i));
}

// ── Lista enlazada con memoria dinámica ──────────────────
typedef struct Nodo {
    int dato;
    struct Nodo *siguiente;
} Nodo;

Nodo *crear_nodo(int dato) {
    Nodo *n = malloc(sizeof(Nodo));
    if (!n) { fprintf(stderr, "Error: malloc falló\n"); exit(1); }
    n->dato = dato;
    n->siguiente = NULL;
    return n;
}

void insertar_frente(Nodo **cabeza, int dato) {
    Nodo *nuevo = crear_nodo(dato);
    nuevo->siguiente = *cabeza;
    *cabeza = nuevo;
}

void imprimir_lista(Nodo *cabeza) {
    for (Nodo *p = cabeza; p; p = p->siguiente)
        printf("%d → ", p->dato);
    printf("NULL\n");
}

void liberar_lista(Nodo **cabeza) {
    Nodo *actual = *cabeza;
    while (actual) {
        Nodo *siguiente = actual->siguiente;
        free(actual);     // liberar cada nodo
        actual = siguiente;
    }
    *cabeza = NULL;       // prevenir use-after-free
}

    demo_punteros();
    printf("\n--- Lista enlazada ---\n");

    Nodo *lista = NULL;

fs.readFile('a.txt', 'utf8', (err, dataA) => {

fsp.readFile('a.txt', 'utf8')
  .then(dataA => fsp.readFile('b.txt', 'utf8').then(dataB => dataA + dataB))
  .then(contenido => fsp.writeFile('resultado.txt', contenido))

async function combinarArchivos() {
  try {
    const [dataA, dataB] = await Promise.all([
      fsp.readFile('a.txt', 'utf8'),
      fsp.readFile('b.txt', 'utf8')   // ambos se leen EN PARALELO
    ]);
    await fsp.writeFile('resultado.txt', dataA + dataB);
    console.log('Listo');
  } catch (err) {
    console.error('Error:', err.message);
  }
}

// ── Retry con backoff exponencial ──────────────────────
async function fetchConRetry(url, maxIntentos = 3) {
  for (let intento = 1; intento <= maxIntentos; intento++) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
      return await res.json();
    } catch (err) {
      if (intento === maxIntentos) throw err;
      const espera = 2 ** intento * 100;   // 200ms, 400ms, 800ms...
      console.log(\`Reintento \${intento}/\${maxIntentos} en \${espera}ms...\`);
      await new Promise(r => setTimeout(r, espera));
    }
  }
}`

function buildSidebar() {
  const nav = document.getElementById('sb-nav');
  BLOQUES.forEach((b, bi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sb-bloque';
    wrap.id = 'sb-b' + bi;

    const hdr = document.createElement('div');
    hdr.className = 'sb-bloque-hdr';
    hdr.innerHTML = `<span class="sb-dot dot${bi}"></span>
      <span class="sb-bloque-title">${b.title}</span>
      <span class="sb-bloque-num">${b.label}</span>
      <span class="sb-chevron">›</span>`;
    hdr.onclick = () => { wrap.classList.toggle('closed'); };
    wrap.appendChild(hdr);

    const items = document.createElement('div');
    items.className = 'sb-items';

    b.sections.forEach(sec => {
      const lbl = document.createElement('div');
      lbl.className = 'sb-sec-label';
      lbl.textContent = sec.title;
      items.appendChild(lbl);

      sec.topics.forEach(t => {
        const a = document.createElement('a');
        a.className = 'sb-item';
        a.textContent = t.title;
        a.href = '#' + topicId(t.title);
        a.onclick = (e) => { e.preventDefault(); scrollToTopic(topicId(t.title)); };
        items.appendChild(a);
      });
    });

    wrap.appendChild(items);
    nav.appendChild(wrap);
  });
}

          ${(t.code||[]).length > 0 ? `<div class="tab-pane" data-pane="2">${(t.code||[]).map(block=>`<div class="code-wrap"><div class="code-label"><span>${safeText(block.label)}</span><button class="copy-btn" onclick="copyCode(this)">copiar</button></div><pre><code>${escapeCode(block.src)}</code></pre></div>`).join('')}</div>` : ''}
        </div>`;

        div.querySelector('.topic-hdr').onclick = () => { div.classList.toggle('open'); };

        div.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            const idx = btn.dataset.tab;
            div.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            div.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            div.querySelector(`.tab-pane[data-pane="${idx}"]`).classList.add('active');
            if (!div.classList.contains('open')) div.classList.add('open');
          };
        });

        sDiv.appendChild(div);
      });

      bDiv.appendChild(sDiv);
    });

    root.appendChild(bDiv);
  });
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
function topicId(title) {
  return 'topic-' + title.slice(0, 30).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
}

function escapeCode(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function safeText(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollToBloque(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (window.innerWidth < 768) toggleSidebar();
}

function scrollToTopic(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (!el.classList.contains('open')) el.classList.add('open');
  if (window.innerWidth < 768) toggleSidebar();
}

function toggleSidebar() {
  const sb = document.getElementById('sb');
  const ov = document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('visible');
}

function copyCode(btn) {
  const code = btn.closest('.code-wrap').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ copiado';
    setTimeout(() => btn.textContent = 'copiar', 1800);
  });
}

function filterSidebar(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.sb-item').forEach(el => {
    const match = !q || el.textContent.toLowerCase().includes(lq);
    el.style.display = match ? '' : 'none';
    if (match && q) {
      el.closest('.sb-bloque').classList.remove('closed');
    }
  });
  document.querySelectorAll('.sb-sec-label').forEach(el => {
    el.style.display = q ? 'none' : '';
  });
}

// ─── INTERSECCIÓN: resaltar elemento activo en sidebar ──────────────────────
function setupObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        document.querySelectorAll('.sb-item').forEach(a => {
          a.classList.toggle('active', a.getAttribute('href') === '#' + id);
        });
      }
    });
  }, { threshold: 0.1, rootMargin: '-50px 0px -60% 0px' });

  document.querySelectorAll('.topic').forEach(el => observer.observe(el));
}

// ─── INIT ────────────────────────────────────────────────────────────────────
buildSidebar();
buildTOC();
buildContent();
setupObserver();
</script>
